name: Portable builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            binary: build/Release/vfs.exe
          - target: linux-x64
            runner: ubuntu-22.04
            binary: build/vfs
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            binary: build/vfs
          - target: macos-x64
            runner: macos-15-intel
            binary: build/vfs
          - target: macos-arm64
            runner: macos-15
            binary: build/vfs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows and Linux
        if: ${{ !startsWith(matrix.target, 'macos-') }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Configure macOS
        if: startsWith(matrix.target, 'macos-')
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target == 'macos-x64' && 'x86_64' || 'arm64' }} -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Verify tests
        run: ctest --test-dir build --build-config Release --output-on-failure
      - name: Package Windows bundle
        if: startsWith(matrix.target, 'windows-')
        run: python scripts/package_portable.py --binary "${{ matrix.binary }}" --target "${{ matrix.target }}" --output dist
      - name: Package Unix bundle
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        run: python3 scripts/package_portable.py --binary "${{ matrix.binary }}" --target "${{ matrix.target }}" --output dist
      - uses: actions/upload-artifact@v7
        if: startsWith(matrix.target, 'windows-')
        with:
          name: vfs-${{ matrix.target }}
          path: dist/vfs-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        with:
          name: vfs-${{ matrix.target }}
          path: dist/vfs-${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
